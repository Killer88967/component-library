<button class="cl-button" data-variant="outline" popovertarget="dimensions">Open popover</button>

<div class="cl-popover" id="dimensions" popover>
  <div class="cl-popover-header">
    <p class="cl-popover-title">Dimensions</p>
    <p class="cl-popover-description">Set the dimensions for the layer.</p>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 2fr; align-items: center; gap: 0.75rem">
    <label class="cl-label" for="dimensions-width">Width</label>
    <input class="cl-input" id="dimensions-width" value="100%" />
    <label class="cl-label" for="dimensions-height">Height</label>
    <input class="cl-input" id="dimensions-height" value="25px" />
  </div>
</div>
