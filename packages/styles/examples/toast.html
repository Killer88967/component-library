<div class="cl-cluster">
  <button
    class="cl-button"
    data-variant="outline"
    data-toast="Event has been created"
    data-toast-description="Sunday, December 03, 2026 at 9:00 AM"
  >
    Show toast
  </button>
  <button
    class="cl-button"
    data-variant="outline"
    data-toast="Changes saved"
    data-toast-type="success"
  >
    Success
  </button>
  <button class="cl-button" data-variant="outline" onclick="cl.toast.error('Something went wrong')">
    Error
  </button>
</div>
