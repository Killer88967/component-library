<button class="cl-button" data-variant="outline" popovertarget="account-menu">Open menu</button>

<div class="cl-menu" id="account-menu" popover role="menu" style="width: 14rem">
  <div class="cl-menu-label">My Account</div>
  <button class="cl-menu-item" role="menuitem">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
      <circle cx="12" cy="7" r="4" />
    </svg>
    Profile
    <span class="cl-menu-shortcut">⇧⌘P</span>
  </button>
  <button class="cl-menu-item" role="menuitem">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path
        d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
      />
      <circle cx="12" cy="12" r="3" />
    </svg>
    Settings
    <span class="cl-menu-shortcut">⌘S</span>
  </button>
  <button class="cl-menu-item" role="menuitemcheckbox" aria-checked="true">Show status bar</button>
  <div class="cl-menu-separator" role="separator"></div>
  <button class="cl-menu-item" role="menuitem" data-variant="destructive">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="m16 17 5-5-5-5" />
      <path d="M21 12H9" />
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
    </svg>
    Log out
    <span class="cl-menu-shortcut">⇧⌘Q</span>
  </button>
</div>
